<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Factory Wars by Gamerax</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0a0a0a; font-family: sans-serif; }
  
  #loader {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:#111; display:flex; flex-direction:column;
    align-items:center; justify-content:center; z-index:10;
    transition: opacity 0.5s;
  }
  #loader h1 { color:#ffcc00; font-size:32px; letter-spacing:2px; }
  #loader p { color:#aaa; margin-top:10px; }
  .spinner {
    margin-top:25px; width:50px; height:50px;
    border:4px solid #333; border-top:4px solid #ffcc00;
    border-radius:50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  iframe { width:100%; height:100%; border:0; display:block; background:black; }
</style>
</head>
<body>

<div id="loader">
  <h1>FACTORY WARS</h1>
  <p>by Gamerax - Loading...</p>
  <div class="spinner"></div>
</div>

<iframe id="game" src="https://mindustrygame.github.io/" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write" allowfullscreen></iframe>

<script>
  // 3 second baad loader hat jayega aur game dikhega
  const loader = document.getElementById('loader');
  const game = document.getElementById('game');
  game.onload = () => {
    setTimeout(() => {
      loader.style.opacity = '0';
      setTimeout(() => loader.remove(), 500);
    }, 2000);
  };
</script>

</body>
</html>
