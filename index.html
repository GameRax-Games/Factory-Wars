<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Factory Wars by Gamerax</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; }
  #loader {
    position:fixed; inset:0; background:#0e0e0e;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:999; color:white; font-family:sans-serif;
  }
  #loader h1 { color:#ffcc00; font-size:36px; }
  .spinner { margin-top:20px; width:40px; height:40px; border:4px solid #333; border-top:4px solid #ffcc00; border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  iframe { width:100%; height:100%; border:0; }
</style>
</head>
<body>
<div id="loader">
  <h1>FACTORY WARS</h1>
  <p>by Gamerax - Loading Game...</p>
  <div class="spinner"></div>
</div>

<iframe id="game" src="https://khoichon.dev/mindustry-web/" allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write; cross-origin-isolated" allowfullscreen></iframe>

<script>
  const loader = document.getElementById('loader');
  document.getElementById('game').onload = () => {
    setTimeout(() => loader.style.display='none', 3000);
  };
</script>
</body>
</html>
